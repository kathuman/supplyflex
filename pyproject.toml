[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "supplyflex"
version = "0.2.0"
description = "Valuing flexibility in supply-chain capacity and network decisions: real options for when, how much and where to build."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Alberto Sepulveda Estay" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["real options", "supply chain", "capacity planning", "network design", "flexibility", "binomial lattice", "operations research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/kathuman/supplyflex"
"Web app" = "https://kathuman.github.io/claude-projects/real-options/"

[tool.hatch.build.targets.wheel]
packages = ["src/supplyflex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
